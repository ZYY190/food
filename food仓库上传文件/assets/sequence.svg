<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="660" viewBox="0 0 1140 660">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="570" y="34" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="22" font-weight="bold" fill="#2F5496" text-anchor="middle">图 6　AI 选餐时序图（6 个对象，含本地兜底分支）</text>
<rect x="50" y="80" width="140" height="38" rx="4" fill="#D9E2F3" stroke="#2F5496" stroke-width="1.3"/>
<text x="120" y="104" font-family="Microsoft YaHei" font-size="13" fill="#1F3864" text-anchor="middle">用户</text>
<line x1="120" y1="118" x2="120" y2="620" stroke="#4472C4" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="230" y="80" width="140" height="38" rx="4" fill="#D9E2F3" stroke="#2F5496" stroke-width="1.3"/>
<text x="300" y="104" font-family="Microsoft YaHei" font-size="13" fill="#1F3864" text-anchor="middle">对话页</text>
<line x1="300" y1="118" x2="300" y2="620" stroke="#4472C4" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="410" y="80" width="140" height="38" rx="4" fill="#D9E2F3" stroke="#2F5496" stroke-width="1.3"/>
<text x="480" y="104" font-family="Microsoft YaHei" font-size="13" fill="#1F3864" text-anchor="middle">智能体</text>
<line x1="480" y1="118" x2="480" y2="620" stroke="#4472C4" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="590" y="80" width="140" height="38" rx="4" fill="#D9E2F3" stroke="#2F5496" stroke-width="1.3"/>
<text x="660" y="104" font-family="Microsoft YaHei" font-size="13" fill="#1F3864" text-anchor="middle">适配层</text>
<line x1="660" y1="118" x2="660" y2="620" stroke="#4472C4" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="770" y="80" width="140" height="38" rx="4" fill="#D9E2F3" stroke="#2F5496" stroke-width="1.3"/>
<text x="840" y="104" font-family="Microsoft YaHei" font-size="13" fill="#1F3864" text-anchor="middle">方舟大模型</text>
<line x1="840" y1="118" x2="840" y2="620" stroke="#4472C4" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="950" y="80" width="140" height="38" rx="4" fill="#D9E2F3" stroke="#2F5496" stroke-width="1.3"/>
<text x="1020" y="104" font-family="Microsoft YaHei" font-size="13" fill="#1F3864" text-anchor="middle">本地菜品库</text>
<line x1="1020" y1="118" x2="1020" y2="620" stroke="#4472C4" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="120" y1="160" x2="300" y2="160" stroke="#404040" stroke-width="1.4" marker-end="url(#a)"/>
<text x="210" y="154" font-family="Microsoft YaHei" font-size="11.5" fill="#595959" text-anchor="middle">1. 输入口味/预算/辣度</text>
<line x1="300" y1="200" x2="480" y2="200" stroke="#404040" stroke-width="1.4" marker-end="url(#a)"/>
<text x="390" y="194" font-family="Microsoft YaHei" font-size="11.5" fill="#595959" text-anchor="middle">2. send() 转发</text>
<line x1="480" y1="240" x2="660" y2="240" stroke="#404040" stroke-width="1.4" marker-end="url(#a)"/>
<text x="570" y="234" font-family="Microsoft YaHei" font-size="11.5" fill="#595959" text-anchor="middle">3. recommend()</text>
<line x1="660" y1="280" x2="840" y2="280" stroke="#404040" stroke-width="1.4" marker-end="url(#a)"/>
<text x="750" y="274" font-family="Microsoft YaHei" font-size="11.5" fill="#595959" text-anchor="middle">4. callArk() chat/completions</text>
<line x1="840" y1="320" x2="660" y2="320" stroke="#404040" stroke-width="1.4" marker-end="url(#a)"/>
<text x="750" y="314" font-family="Microsoft YaHei" font-size="11.5" fill="#595959" text-anchor="middle">5. 返回话术+菜品编号</text>
<line x1="660" y1="360" x2="480" y2="360" stroke="#404040" stroke-width="1.4" marker-end="url(#a)"/>
<text x="570" y="354" font-family="Microsoft YaHei" font-size="11.5" fill="#595959" text-anchor="middle">6. 解析 content</text>
<line x1="480" y1="400" x2="1020" y2="400" stroke="#404040" stroke-width="1.4" marker-end="url(#a)"/>
<text x="750" y="394" font-family="Microsoft YaHei" font-size="11.5" fill="#595959" text-anchor="middle">7. 按编号匹配菜品</text>
<line x1="1020" y1="440" x2="480" y2="440" stroke="#404040" stroke-width="1.4" marker-end="url(#a)"/>
<text x="750" y="434" font-family="Microsoft YaHei" font-size="11.5" fill="#595959" text-anchor="middle">8. 返回菜品对象</text>
<line x1="480" y1="480" x2="300" y2="480" stroke="#404040" stroke-width="1.4" marker-end="url(#a)"/>
<text x="390" y="474" font-family="Microsoft YaHei" font-size="11.5" fill="#595959" text-anchor="middle">9. 生成带来源标注卡片</text>
<line x1="300" y1="520" x2="120" y2="520" stroke="#404040" stroke-width="1.4" marker-end="url(#a)"/>
<text x="210" y="514" font-family="Microsoft YaHei" font-size="11.5" fill="#595959" text-anchor="middle">10. 展示推荐结果</text>
<line x1="480" y1="400" x2="1020" y2="570" stroke="#C00000" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#a)"/>
<text x="750" y="548" font-family="Microsoft YaHei" font-size="11.5" fill="#C00000">解析失败→localRecommend()</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#404040"/></marker></defs>
</svg>